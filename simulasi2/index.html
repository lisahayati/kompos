<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Penjaga Bumi: Daun Kering Jadi Kompos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1f2937; --muted:#475569; --cream:#fffbeb; --paper:#ffffff;
  --green:#16a34a; --green-d:#14532d; --green-l:#dcfce7;
  --amber:#d97706; --amber-l:#fef3c7; --red:#dc2626; --red-l:#fee2e2;
  --blue:#0284c7; --yellow:#facc15;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#0b2e22}
body{font-family:'Baloo 2','Nunito','Segoe UI Rounded','Segoe UI',system-ui,sans-serif;color:var(--ink)}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform:translate(-50%,-50%) scale(var(--s,1));overflow:hidden;background:#e0f2fe}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}

/* ---------- top bar ---------- */
#topbar{position:absolute;inset:0 0 auto 0;height:96px;display:flex;align-items:center;gap:18px;padding:0 24px;background:var(--green-d);color:#fff;z-index:40;box-shadow:0 6px 0 rgba(0,0,0,.18)}
#topbar .brand{display:flex;align-items:center;gap:14px;font-weight:800;font-size:34px;line-height:1}
#topbar .brand small{display:block;font-size:20px;font-weight:600;opacity:.8}
#topbar .sp{flex:1}
.pill{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.14);border-radius:999px;padding:8px 22px;font-size:32px;font-weight:800}
.tb{background:rgba(255,255,255,.14);border:none;border-radius:18px;height:68px;min-width:68px;padding:0 18px;font-size:26px;font-weight:700;color:#fff;display:flex;align-items:center;gap:8px}
.tb:active{background:rgba(255,255,255,.3)}
.tb.off{opacity:.5}
.tb.fs{background:var(--yellow);color:var(--green-d)}
#screen{position:absolute;top:96px;left:0;right:0;bottom:0;overflow:hidden}

/* ---------- generic ---------- */
.btn{border:none;border-radius:24px;padding:18px 38px;font-size:34px;font-weight:800;box-shadow:0 8px 0 rgba(0,0,0,.22);transition:transform .08s,box-shadow .08s;display:inline-flex;align-items:center;gap:12px;justify-content:center}
.btn:active{transform:translateY(6px);box-shadow:0 2px 0 rgba(0,0,0,.22)}
.btn:disabled{opacity:.45;filter:grayscale(.6);pointer-events:none}
.btn.g{background:var(--green);color:#fff}
.btn.y{background:var(--yellow);color:var(--green-d)}
.btn.r{background:var(--red);color:#fff}
.btn.w{background:#fff;color:var(--green-d)}
.btn.b{background:var(--blue);color:#fff}
.btn.sm{font-size:28px;padding:12px 26px;border-radius:18px}
.glow{animation:glow 1.2s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 8px 0 rgba(0,0,0,.22),0 0 0 14px rgba(250,204,21,.45)}}
.m-tag{position:absolute;left:24px;top:18px;z-index:12;background:var(--green-d);color:#fff;font-weight:800;font-size:28px;padding:8px 24px;border-radius:999px;box-shadow:0 5px 0 rgba(0,0,0,.2)}
.scene{position:absolute;inset:0;width:100%;height:100%;display:block}

/* narrator */
.narrator{position:absolute;left:24px;top:76px;z-index:12;display:flex;align-items:flex-start;gap:6px;max-width:1080px;pointer-events:none}
.narrator svg.mascot{width:120px;height:136px;flex:none;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(-3deg)}}
.bubble{pointer-events:auto;position:relative;background:#fff;border:5px solid var(--green-d);border-radius:28px;padding:16px 26px;font-size:30px;font-weight:600;line-height:1.3;margin-top:14px;box-shadow:0 6px 0 rgba(0,0,0,.15)}
.bubble:before{content:"";position:absolute;left:-22px;top:30px;border:14px solid transparent;border-right:18px solid var(--green-d)}
.bubble b{color:var(--green)}
.bubble .spk{position:absolute;right:-22px;bottom:-22px;width:56px;height:56px;border-radius:50%;border:4px solid var(--green-d);background:var(--yellow);font-size:26px}
.bubble.pop{animation:popin .35s ease}
@keyframes popin{0%{transform:scale(.85);opacity:.3}100%{transform:scale(1);opacity:1}}

/* modal */
#modal{position:absolute;inset:0;z-index:60;background:rgba(6,30,22,.66);display:none;align-items:center;justify-content:center}
#modal.show{display:flex}
#modal .card{width:1560px;max-height:960px;overflow:auto;background:var(--cream);border-radius:40px;border:8px solid var(--green-d);padding:34px 48px 40px;box-shadow:0 20px 0 rgba(0,0,0,.25);animation:popin .35s ease}
#modal .card.bad{border-color:#7f1d1d}
#modal .card.warn{border-color:#92400e}
#modal h2{margin:0 0 10px;font-size:56px;line-height:1.1}
#modal .lead{font-size:30px;margin:0 0 18px;color:var(--muted);font-weight:600}
#modal .acts{display:flex;gap:20px;justify-content:center;flex-wrap:wrap;margin-top:20px;position:sticky;bottom:-40px;background:var(--cream);padding:16px 0 4px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.fact{background:#fff;border-radius:24px;padding:18px 22px;border:4px solid #e5e7eb;font-size:24px;line-height:1.3}
.fact .ic{font-size:54px;line-height:1}
.fact h4{margin:6px 0 6px;font-size:30px;line-height:1.1}
.fact.bad{border-color:#fecaca}.fact.bad h4{color:#b91c1c}
.fact.good{border-color:#bbf7d0}.fact.good h4{color:#15803d}
.fact.warn{border-color:#fde68a}.fact.warn h4{color:#b45309}
.note{margin-top:18px;background:#fff7ed;border-left:10px solid #ea580c;border-radius:16px;padding:14px 22px;font-size:25px;line-height:1.35}
.note.g{background:#f0fdf4;border-color:var(--green)}
.row{display:flex;gap:22px;align-items:stretch}

/* toast & points */
#toast{position:absolute;left:50%;top:120px;transform:translateX(-50%) translateY(-30px);opacity:0;z-index:70;background:var(--green-d);color:#fff;font-size:32px;font-weight:700;padding:14px 34px;border-radius:999px;transition:.3s;pointer-events:none;max-width:1500px;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.bad{background:#991b1b}
.pts{position:absolute;z-index:80;font-size:48px;font-weight:800;color:#facc15;-webkit-text-stroke:2px #14532d;pointer-events:none;animation:ptsUp 1.2s ease-out forwards}
.pts.neg{color:#fca5a5;-webkit-text-stroke:2px #7f1d1d}
@keyframes ptsUp{0%{transform:translate(-50%,0) scale(.6);opacity:0}20%{transform:translate(-50%,-20px) scale(1.15);opacity:1}100%{transform:translate(-50%,-140px) scale(1);opacity:0}}
#badgePop{position:absolute;inset:0;z-index:75;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.45)}
#badgePop.show{display:flex}
#badgePop .bp{background:#fff;border-radius:40px;border:8px solid #ca8a04;padding:36px 70px;text-align:center;animation:badgeIn .6s cubic-bezier(.2,1.6,.4,1)}
#badgePop .bp .medal{font-size:150px;line-height:1;animation:spinY 1.6s ease}
#badgePop .bp h3{font-size:30px;margin:6px 0 0;color:#a16207}
#badgePop .bp h2{font-size:56px;margin:0 0 6px}
#badgePop .bp p{font-size:28px;margin:0 0 20px;color:var(--muted)}
@keyframes badgeIn{0%{transform:scale(.2) rotate(-20deg)}100%{transform:scale(1)}}
@keyframes spinY{0%{transform:rotateY(0)}100%{transform:rotateY(720deg)}}
.confetti{position:absolute;top:-30px;width:18px;height:28px;z-index:90;pointer-events:none;border-radius:4px}

/* ---------- home ---------- */
.home{position:absolute;inset:0;background:linear-gradient(#7dd3fc,#e0f2fe 55%,#bbf7d0 55%,#86efac)}
.home h1{position:absolute;left:0;right:0;top:104px;text-align:center;margin:0;font-size:78px;line-height:1;color:var(--green-d);text-shadow:0 6px 0 #fff}
.home .sub{position:absolute;left:0;right:0;top:192px;text-align:center;font-size:32px;font-weight:600;color:#0f172a}
.mcards{position:absolute;left:70px;right:70px;top:268px;display:grid;grid-template-columns:repeat(4,1fr);gap:30px}
.mcard{position:relative;background:#fff;border:6px solid var(--green-d);border-radius:36px;padding:20px 22px 24px;text-align:center;box-shadow:0 12px 0 rgba(20,83,45,.35);transition:transform .15s}
.mcard:active{transform:translateY(8px);box-shadow:0 4px 0 rgba(20,83,45,.35)}
.mcard .num{position:absolute;top:-26px;left:50%;transform:translateX(-50%);background:var(--yellow);border:5px solid var(--green-d);border-radius:999px;font-weight:800;font-size:28px;padding:2px 26px;white-space:nowrap}
.mcard svg.ill{width:210px;height:180px;display:block;margin:14px auto 4px}
.mcard h3{margin:0;font-size:38px;line-height:1.05;color:var(--green-d)}
.mcard p{margin:8px 0 0;font-size:24px;line-height:1.25;color:var(--muted);font-weight:600;min-height:62px}
.mcard .st{margin-top:12px;font-size:26px;font-weight:800;color:#a16207;min-height:36px}
.mcard.done{border-color:var(--green);background:#f0fdf4}
.homeacts{position:absolute;left:0;right:0;bottom:46px;display:flex;justify-content:center;gap:26px}
.fall{position:absolute;top:-80px;width:60px;height:60px;pointer-events:none;opacity:.9}

/* ---------- halaman depan ---------- */
.front{position:absolute;inset:0;background:linear-gradient(#7dd3fc,#e0f2fe 58%,#bbf7d0 58%,#86efac);overflow:hidden}
.fnav{position:absolute;top:16px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:30;background:rgba(255,255,255,.92);padding:8px;border-radius:999px;box-shadow:0 6px 0 rgba(0,0,0,.12);border:4px solid var(--green-d);white-space:nowrap}
.fnav button{border:none;border-radius:999px;padding:8px 20px;font-size:25px;font-weight:800;background:transparent;color:var(--green-d)}
.fnav button.on{background:var(--green-d);color:#fff}
.fnav button:active{background:var(--green-l)}
.parrows{position:absolute;left:40px;right:40px;bottom:34px;display:flex;justify-content:space-between;z-index:25;pointer-events:none}
.parrows .btn{pointer-events:auto}
.cov{position:absolute;left:80px;top:118px;width:1080px;height:720px;background:#fff;border:8px solid var(--green-d);border-radius:48px;padding:46px 56px;box-shadow:0 14px 0 rgba(20,83,45,.3)}
.covtag{display:inline-block;background:var(--yellow);color:var(--green-d);font-size:30px;font-weight:800;padding:6px 26px;border-radius:999px;border:4px solid var(--green-d)}
.covtopic{margin-top:22px;font-size:38px;font-weight:800;color:#b45309}
.cov h1{margin:6px 0 0;font-size:72px;line-height:1.05;color:var(--green-d)}
.covmeta{position:absolute;left:56px;right:56px;bottom:44px;display:grid;gap:14px}
.covmeta div{display:flex;flex-direction:column;background:#f0fdf4;border-left:12px solid var(--green);border-radius:18px;padding:10px 24px}
.covmeta span{font-size:24px;font-weight:700;color:var(--muted)}
.covmeta b{font-size:38px;line-height:1.15;color:#0f172a}
.covart{position:absolute;left:1190px;top:120px;width:700px;height:700px}
.aper-t{position:absolute;left:30px;top:104px;z-index:12;background:rgba(255,255,255,.94);border:6px solid var(--green-d);border-radius:32px;padding:12px 30px;box-shadow:0 8px 0 rgba(0,0,0,.15)}
.aper-t .tg{font-size:26px;font-weight:800;color:#b45309}
.aper-t h2{margin:0;font-size:50px;line-height:1.05;color:var(--green-d)}
.qs{position:absolute;left:340px;right:340px;bottom:30px;display:grid;grid-template-columns:repeat(4,1fr);gap:16px;z-index:12}
.q{background:rgba(255,255,255,.95);border:5px solid var(--green-d);border-radius:26px;padding:12px 16px;font-size:24px;font-weight:700;line-height:1.2;text-align:left;box-shadow:0 6px 0 rgba(0,0,0,.18);transition:transform .15s}
.q .e{font-size:44px;line-height:1;display:block;margin-bottom:4px}
.q.on{background:var(--yellow);transform:translateY(-10px)}
.ptitle{position:absolute;left:0;right:0;top:108px;text-align:center;margin:0;font-size:72px;line-height:1;color:var(--green-d);text-shadow:0 6px 0 #fff}
.tps{position:absolute;left:170px;right:170px;top:220px;display:grid;gap:24px}
.tp{display:flex;align-items:center;gap:28px;background:#fff;border:6px solid var(--green-d);border-radius:36px;padding:20px 34px;box-shadow:0 10px 0 rgba(20,83,45,.25);text-align:left}
.tp .n{flex:none;width:96px;height:96px;border-radius:50%;background:var(--yellow);border:6px solid var(--green-d);font-size:52px;font-weight:800;display:flex;align-items:center;justify-content:center;color:var(--green-d)}
.tp .e{flex:none;font-size:80px;line-height:1}
.tp .t{flex:1;font-size:35px;line-height:1.28;font-weight:600}
.tp .t b{color:var(--green)}
.tp .chip{flex:none;font-size:22px;font-weight:800;background:var(--green-l);color:var(--green-d);border-radius:999px;padding:6px 18px}
.pls{position:absolute;left:110px;right:110px;top:215px;display:grid;grid-template-columns:1fr 1fr;gap:44px}
.pl{position:relative;background:#fff;border:8px solid var(--green-d);border-radius:44px;padding:30px 44px 36px;box-shadow:0 12px 0 rgba(20,83,45,.28);text-align:center}
.pl .ab{position:absolute;top:-34px;left:40px;width:84px;height:84px;border-radius:50%;background:var(--yellow);border:6px solid var(--green-d);font-size:46px;font-weight:800;color:var(--green-d);display:flex;align-items:center;justify-content:center}
.pl svg{width:100%;height:230px;display:block}
.pl h3{margin:6px 0 10px;font-size:58px;line-height:1;color:var(--green-d)}
.pl p{margin:0;font-size:32px;line-height:1.32;font-weight:600;color:#1f2937}
.rq{position:absolute;left:120px;right:120px;top:200px;text-align:center;font-size:46px;font-weight:800;line-height:1.2;color:#0f172a}
.emos{position:absolute;left:0;right:0;top:310px;display:flex;justify-content:center;gap:60px}
.emo{width:400px;background:#fff;border:8px solid var(--green-d);border-radius:48px;padding:20px 10px 26px;box-shadow:0 12px 0 rgba(20,83,45,.28);transition:transform .12s}
.emo:active{transform:translateY(8px);box-shadow:0 4px 0 rgba(20,83,45,.28)}
.emo .f{font-size:160px;line-height:1.1;display:block}
.emo .l{display:block;font-size:40px;font-weight:800;color:var(--green-d)}
.emo .c{display:inline-block;margin-top:10px;font-size:28px;font-weight:800;background:#f1f5f9;border-radius:999px;padding:4px 22px}
.emo.on{background:#fef9c3;border-color:#ca8a04}
.emo.hop .f{animation:hop .6s ease}
@keyframes hop{30%{transform:translateY(-40px) scale(1.15)}60%{transform:translateY(0) scale(.95)}}
.rmsg{position:absolute;left:260px;right:260px;bottom:120px;text-align:center;font-size:34px;font-weight:700;line-height:1.3;background:rgba(255,255,255,.95);border:5px solid var(--green);border-radius:30px;padding:16px 30px;opacity:0;transition:opacity .3s}
.rmsg.show{opacity:1}

/* ---------- mission 1 ---------- */
.choices{position:absolute;left:0;right:0;bottom:28px;display:flex;justify-content:center;gap:34px;z-index:12}
.choice{width:400px;height:170px;border:6px solid rgba(0,0,0,.25);border-radius:34px;font-size:40px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:16px;box-shadow:0 10px 0 rgba(0,0,0,.25);transition:transform .1s}
.choice span{font-size:84px}
.choice small{display:block;font-size:22px;font-weight:600;opacity:.85;line-height:1.1}
.choice:active{transform:translateY(8px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.choice.burn{background:#fecaca;color:#7f1d1d}
.choice.dump{background:#e5e7eb;color:#1f2937}
.choice.comp{background:#bbf7d0;color:#14532d}
.choice.seen{position:relative}
.choice.seen:after{content:"✓ sudah dicoba";position:absolute;top:-20px;right:16px;font-size:20px;background:#1f2937;color:#fff;border-radius:999px;padding:2px 14px}
.choices.lock .choice{pointer-events:none;opacity:.55}
.aqi{position:absolute;right:24px;top:18px;z-index:12;width:440px;background:#fff;border:5px solid var(--green-d);border-radius:26px;padding:12px 20px;box-shadow:0 6px 0 rgba(0,0,0,.15)}
.aqi .t{font-size:24px;font-weight:800}
.aqi .bar{position:relative;height:28px;border-radius:14px;background:linear-gradient(90deg,#22c55e,#facc15 35%,#f97316 60%,#dc2626 80%,#7e22ce);margin:6px 0}
.aqi .bar i{position:absolute;top:-10px;left:6%;width:12px;height:48px;border-radius:6px;background:#111827;border:3px solid #fff;transform:translateX(-50%);transition:left 3s ease}
.aqi .l{font-size:28px;font-weight:800}
.kid-shake{animation:cough .25s linear infinite}
@keyframes cough{0%,100%{translate:0 0}25%{translate:-5px 2px}75%{translate:5px -2px}}
.flick{animation:flick .18s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes flick{from{scale:1 1}to{scale:1.08 .9}}
.sway{animation:sway 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway{50%{rotate:2deg}}
.drift{animation:drift 40s linear infinite}
@keyframes drift{from{translate:-300px 0}to{translate:2200px 0}}
.flag{animation:flag 1.5s ease-in-out infinite;transform-box:fill-box;transform-origin:0 50%}
@keyframes flag{50%{scale:.92 1}}
.pmviz{display:flex;align-items:center;gap:16px;background:#fff;border:4px solid #e5e7eb;border-radius:24px;padding:12px 20px;margin-top:16px;font-size:24px}

/* ---------- mission 2 ---------- */
.item{position:absolute;width:150px;height:170px;margin:-75px 0 0 -75px;touch-action:none;z-index:5;text-align:center;cursor:grab}
.item svg{width:130px;height:130px;filter:drop-shadow(0 6px 0 rgba(0,0,0,.18));pointer-events:none}
.item .nm{display:inline-block;font-size:20px;font-weight:800;background:rgba(255,255,255,.92);border-radius:999px;padding:0 12px;white-space:nowrap;pointer-events:none}
.item.drag{z-index:30;cursor:grabbing}
.item.drag svg{transform:scale(1.18);filter:drop-shadow(0 16px 6px rgba(0,0,0,.3))}
.item.back{transition:left .45s ease,top .45s ease}
.item.wiggle{animation:wig .6s ease 2}
@keyframes wig{25%{rotate:-8deg}75%{rotate:8deg}}
.bin{position:absolute;top:590px;width:460px;height:380px;margin-left:-230px;text-align:center;z-index:4}
.bin svg{width:330px;height:285px;display:block;margin:0 auto;overflow:visible}
.bin .lid{transition:transform .3s;transform-box:fill-box;transform-origin:0% 100%}
.bin.open .lid{transform:rotate(-28deg) translate(-10px,-10px)}
.bin .lbl{margin-top:-6px;display:inline-block;color:#fff;font-weight:800;font-size:30px;line-height:1.05;border-radius:18px;padding:6px 22px;box-shadow:0 5px 0 rgba(0,0,0,.2)}
.bin .lbl small{display:block;font-size:20px;font-weight:600;opacity:.9}
.bin .cnt{position:absolute;right:58px;top:8px;width:66px;height:66px;border-radius:50%;background:#fff;border:5px solid #1f2937;font-size:32px;font-weight:800;line-height:56px}
.bin.hover svg{transform:scale(1.08)}
.bin.shake{animation:wig .4s ease 2}
.fb{position:absolute;right:24px;top:76px;width:700px;z-index:12;background:#fff;border:5px solid var(--green-d);border-radius:26px;padding:14px 22px;font-size:26px;line-height:1.3;min-height:100px;box-shadow:0 6px 0 rgba(0,0,0,.15)}
.fb.ok{border-color:var(--green);background:#f0fdf4}
.fb.no{border-color:var(--red);background:#fef2f2}
.fb b{font-size:28px}
.prog{position:absolute;right:24px;top:18px;z-index:12;background:#fff;border:5px solid var(--green-d);border-radius:999px;padding:4px 24px;font-size:28px;font-weight:800}

/* ---------- mission 3 ---------- */
.lab{position:absolute;inset:0;background:linear-gradient(#ecfeff,#cffafe 70%,#a5f3fc)}
.lab .bench{position:absolute;left:0;right:0;bottom:0;height:120px;background:#92400e;border-top:14px solid #b45309}
.labviz{position:absolute;left:20px;top:70px;width:640px;height:900px}
.panel{position:absolute;left:680px;right:24px;top:20px;bottom:24px;background:#fff;border:6px solid var(--green-d);border-radius:36px;padding:22px 34px;display:flex;flex-direction:column;box-shadow:0 10px 0 rgba(0,0,0,.15)}
.stepper{display:flex;gap:10px;margin-bottom:10px}
.stepper div{flex:1;text-align:center;font-size:21px;font-weight:800;padding:8px 4px;border-radius:16px;background:#f1f5f9;color:#94a3b8;line-height:1.1}
.stepper div.on{background:var(--yellow);color:var(--green-d)}
.stepper div.ok{background:var(--green-l);color:var(--green)}
.panel h2{margin:4px 0 2px;font-size:46px;line-height:1.05;color:var(--green-d)}
.panel .desc{font-size:27px;line-height:1.3;color:var(--muted);font-weight:600;margin:0 0 14px}
.pbody{flex:1;position:relative;min-height:0}
.pfoot{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:12px}
.ings{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}
.ing{background:#f8fafc;border:5px solid #e2e8f0;border-radius:24px;padding:10px 6px 12px;text-align:center;font-size:23px;font-weight:800;line-height:1.1;min-height:214px;transition:transform .1s}
.ing:active{transform:scale(.95)}
.ing .ic{font-size:72px;line-height:104px;height:104px;display:flex;align-items:center;justify-content:center}
.ing .ic svg{width:100px;height:100px}
.ing.pick{background:var(--green-l);border-color:var(--green)}
.ing.no{background:var(--red-l);border-color:var(--red);animation:wig .4s ease 2}
.ing .tg{display:block;font-size:17px;color:#64748b;margin-top:4px}
.info{margin-top:16px;border-radius:22px;padding:14px 22px;font-size:27px;line-height:1.3;background:#f1f5f9;border-left:12px solid #94a3b8;min-height:92px}
.info.ok{background:#f0fdf4;border-color:var(--green)}
.info.no{background:#fef2f2;border-color:var(--red)}
.info.warn{background:#fffbeb;border-color:var(--amber)}
.chk{display:flex;gap:16px;font-size:26px;font-weight:800}
.chk span{padding:6px 18px;border-radius:999px;background:#f1f5f9;color:#94a3b8}
.chk span.ok{background:var(--green-l);color:var(--green)}
.chop{position:relative;height:430px;border-radius:30px;background:#fde68a;border:6px dashed #b45309;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:manipulation}
.chop .bigleaf{width:340px;height:340px;transition:transform .2s}
.chop .piece{position:absolute;width:70px;height:70px;pointer-events:none}
.meterbar{position:relative;height:56px;border-radius:28px;background:#e2e8f0;overflow:hidden;border:4px solid #334155}
.meterbar .fill{position:absolute;left:0;top:0;bottom:0;background:var(--green);transition:width .3s}
.meterbar .zone{position:absolute;top:0;bottom:0;background:rgba(22,163,74,.25);border-left:4px dashed var(--green);border-right:4px dashed var(--green)}
.meterbar .val{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;color:#0f172a}
input.big{-webkit-appearance:none;appearance:none;width:100%;height:40px;border-radius:20px;background:linear-gradient(90deg,#b45309,#65a30d);outline:none;margin:24px 0}
input.big::-webkit-slider-thumb{-webkit-appearance:none;width:84px;height:84px;border-radius:50%;background:var(--yellow);border:7px solid var(--green-d);box-shadow:0 5px 0 rgba(0,0,0,.25)}
input.big::-moz-range-thumb{width:72px;height:72px;border-radius:50%;background:var(--yellow);border:7px solid var(--green-d)}
.ratio{display:flex;gap:10px;align-items:flex-end;justify-content:center;height:190px}
.ratio i{display:block;width:96px;border-radius:14px 14px 4px 4px;border:4px solid rgba(0,0,0,.25)}
.simgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
.gauge{background:#f8fafc;border:4px solid #e2e8f0;border-radius:22px;padding:10px 16px}
.gauge .h{display:flex;justify-content:space-between;font-size:24px;font-weight:800}
.gauge .h b{font-size:34px}
.gauge .meterbar{height:30px;margin-top:6px}
.daybox{font-size:30px;font-weight:800;display:flex;align-items:center;gap:14px}
.phase{display:inline-block;padding:4px 18px;border-radius:999px;color:#fff;font-size:26px}
.chart{width:100%;height:230px;background:#f8fafc;border:4px solid #e2e8f0;border-radius:22px;margin-top:12px}
.simbtns{display:flex;gap:14px;flex-wrap:wrap}

/* ---------- mission 4 ---------- */
.tools{position:absolute;left:0;right:0;bottom:22px;display:flex;justify-content:center;gap:22px;z-index:12}
.tool{width:250px;height:150px;border-radius:30px;border:6px solid var(--green-d);background:#fff;font-size:28px;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 8px 0 rgba(0,0,0,.2);line-height:1.1}
.tool span{font-size:62px;line-height:1}
.tool.sel{background:var(--yellow);transform:translateY(-12px)}
.bed-hit{cursor:pointer}
.fruit{cursor:pointer}
.basket{position:absolute;right:24px;top:18px;z-index:12;background:#fff;border:5px solid var(--green-d);border-radius:999px;padding:4px 26px;font-size:36px;font-weight:800}
.grow-pop{animation:growpop .6s ease;transform-box:fill-box;transform-origin:50% 100%}
@keyframes growpop{0%{scale:.85}60%{scale:1.06}100%{scale:1}}

/* ---------- final ---------- */
.cert{position:absolute;left:180px;right:180px;top:30px;bottom:30px;background:#fffbeb;border:14px double #a16207;border-radius:40px;text-align:center;padding:18px 60px}
.cert h1{margin:0;font-size:64px;color:var(--green-d);line-height:1}
.cert .nm{font-size:58px;font-weight:800;color:#a16207;border-bottom:5px dashed #d97706;display:inline-block;min-width:700px;padding:0 30px;margin:8px 0}
.cert .badges{display:flex;justify-content:center;gap:22px;margin:10px 0}
.cert .bd{width:200px;background:#fff;border:5px solid #e5e7eb;border-radius:26px;padding:10px 8px;font-size:21px;font-weight:800;line-height:1.1}
.cert .bd .e{font-size:54px;line-height:1.15}
.cert .bd.no{opacity:.35;filter:grayscale(1)}
.cert .pred{font-size:42px;font-weight:800;color:var(--green)}
.namein{font:inherit;font-size:34px;font-weight:700;padding:6px 24px;border-radius:20px;border:5px solid var(--green-d);width:640px;text-align:center;-webkit-user-select:text;user-select:text}
.pledge{font-size:26px;line-height:1.3;background:#fff;border-radius:24px;padding:14px 28px;border:4px solid #bbf7d0;margin:10px auto;max-width:1300px;text-align:left}
@media print{
  body{background:#fff}
  #topbar,.noprint{display:none!important}
}
</style>

</svg>

<div id="stage">
  <header id="topbar">
    <button class="tb" id="bHome" title="Beranda">🏠 Beranda</button>
    <div class="brand"><svg width="60" height="68"><use href="#mascot"/></svg><div>Penjaga Bumi<small>IPA Kelas VII · SMP Negeri 1 Bandar Seikijang</small></div></div>

  <div id="toast"></div>

<script>
/* =========================================================
   PENJAGA BUMI — game edukasi kompos vs pembakaran daun
   ========================================================= */
const NS = 'http://www.w3.org/2000/svg';
const $ = s => document.querySelector(s);
const stage = $('#stage'), screen = $('#screen');
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

/* ---------- penskalaan panggung 1920x1080 ---------- */
let SCALE = 1;
function fit() {
  SCALE = Math.min(innerWidth / 1920, innerHeight / 1080);
  stage.style.setProperty('--s', SCALE);
}
addEventListener('resize', fit); fit();
function toStage(e) {
  const r = stage.getBoundingClientRect();
  return { x: (e.clientX - r.left) / SCALE, y: (e.clientY - r.top) / SCALE };
}

/* ---------- state & penyimpanan ---------- */
const MAX = { m1: 120, m2: 150, m3: 150, m4: 120 };
const S0 = { ms: {}, done: {}, badges: {}, sound: true, narr: false, name: '', compost: null };
let S = load();
function load() {
  try { const s = JSON.parse(localStorage.getItem('penjagaBumi')); if (s && s.ms) return Object.assign(JSON.parse(JSON.stringify(S0)), s); } catch (e) {}
  return JSON.parse(JSON.stringify(S0));
}
function save() { try { localStorage.setItem('penjagaBumi', JSON.stringify(S)); } catch (e) {} }

let curMission = null, cur = 0;
function totalScore() {
  let t = 0;
  for (const m in MAX) t += (m === curMission) ? Math.max(cur, S.ms[m] || 0) : (S.ms[m] || 0);
  return t;
}
function updateHud() {
  $('#score').textContent = totalScore();
  $('#badges').textContent = Object.keys(S.badges).length;
  $('#bSnd').classList.toggle('off', !S.sound); $('#bSnd').textContent = S.sound ? '🔊' : '🔇';
  $('#bNarr').classList.toggle('off', !S.narr);
}
function addPts(n, x, y) {
  cur += n; updateHud();
  if (x != null) {
    const d = document.createElement('div');
    d.className = 'pts' + (n < 0 ? ' neg' : ''); d.textContent = (n > 0 ? '+' : '') + n;
    d.style.left = x + 'px'; d.style.top = y + 'px';
    stage.appendChild(d); setTimeout(() => d.remove(), 1300);
  }
}
function finishMission(m) {
  S.ms[m] = Math.max(S.ms[m] || 0, cur); S.done[m] = true; save(); updateHud();
}

/* ---------- timer yang dibersihkan saat ganti layar ---------- */
let timers = [], runId = 0;
function later(fn, ms) { const id = setTimeout(fn, ms); timers.push(id); return id; }
function every(fn, ms) { const id = setInterval(fn, ms); timers.push(id); return id; }
function clearTimers() { timers.forEach(t => { clearTimeout(t); clearInterval(t); }); timers = []; }
function sleep(ms) { return new Promise(r => later(r, ms)); }

/* ---------- suara ---------- */
let AC = null;
function ac() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (AC && AC.state === 'suspended') AC.resume(); return AC; }
function tone(f, d = .15, type = 'sine', v = .18, delay = 0, f2) {
  const a = ac(); if (!a || !S.sound) return;
  const t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + d);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + d + .05);
}
function noise(d = .6, v = .12, lp = 1200) {
  const a = ac(); if (!a || !S.sound) return;
  const len = a.sampleRate * d, buf = a.createBuffer(1, len, a.sampleRate), ch = buf.getChannelData(0);
  for (let i = 0; i < len; i++) ch[i] = (Math.random() * 2 - 1) * (Math.random() < .08 ? 1 : .3);
  const src = a.createBufferSource(), g = a.createGain(), f = a.createBiquadFilter();
  f.type = 'lowpass'; f.frequency.value = lp; src.buffer = buf;
  g.gain.setValueAtTime(v, a.currentTime); g.gain.exponentialRampToValueAtTime(.001, a.currentTime + d);
  src.connect(f).connect(g).connect(a.destination); src.start();
}
const sfx = {
  click: () => tone(620, .08, 'triangle', .14),
  good: () => { tone(660, .12, 'triangle'); tone(990, .2, 'triangle', .18, .1); },
  bad: () => tone(220, .3, 'sawtooth', .1, 0, 140),
  pop: () => tone(500, .1, 'sine', .16, 0, 1100),
  win: () => [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, .28, 'triangle', .18, i * .11)),
  cough: () => { noise(.18, .2, 900); later(() => noise(.16, .18, 800), 260); },
  water: () => { for (let i = 0; i < 5; i++) tone(rnd(900, 1600), .06, 'sine', .08, i * .05); },
};

/* ---------- narasi (Text-to-Speech) ---------- */
function speak(t) {
  if (!S.narr || !('speechSynthesis' in window)) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(t.replace(/<[^>]+>/g, '').replace(/[\u{1F300}-\u{1FAFF}☀-➿]/gu, ''));
    u.lang = 'id-ID'; u.rate = 1;
    const v = speechSynthesis.getVoices().find(v => /^id/i.test(v.lang)); if (v) u.voice = v;
    speechSynthesis.speak(u);
  } catch (e) {}
}
function narrator(text) {
  return `<div class="narrator"><svg class="mascot" viewBox="0 0 140 160"><use href="#mascot"/></svg><div class="bubble" id="say"><span id="sayT">${text || ''}</span><button class="spk" id="spk" title="Bacakan">🔊</button></div></div>`;
}
function say(text) {
  const b = $('#say'), t = $('#sayT'); if (!t) return;
  t.innerHTML = text; b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop');
  speak(text);
}
document.addEventListener('click', e => {
  if (e.target.closest('#spk')) { const t = $('#sayT'); if (t) { const o = S.narr; S.narr = true; speak(t.innerHTML); S.narr = o; } }
});

/* ---------- toast, modal, lencana, confetti ---------- */
let toastT;
function toast(msg, bad) {
  const t = $('#toast'); t.innerHTML = msg; t.className = 'show' + (bad ? ' bad' : '');
  clearTimeout(toastT); toastT = setTimeout(() => t.className = '', 2600);
}
function modal({ title, lead = '', html = '', tone = '', buttons = [] }) {
  const c = $('#mcard'); c.className = 'card ' + tone;
  c.innerHTML = `<h2>${title}</h2>${lead ? `<p class="lead">${lead}</p>` : ''}${html}<div class="acts"></div>`;
  const acts = c.querySelector('.acts');
  buttons.forEach(b => {
    const el = document.createElement('button'); el.className = 'btn ' + (b.cls || 'g'); el.innerHTML = b.label;
    el.onclick = () => { sfx.click(); if (b.keep !== true) closeModal(); b.on && b.on(); };
    acts.appendChild(el);
  });
  $('#modal').classList.add('show'); c.scrollTop = 0;
  speak(title + '. ' + lead);
}
function closeModal() { $('#modal').classList.remove('show'); }

const BADGES = {
  udara:   { e: '🌬️', t: 'Pahlawan Udara Bersih', d: 'Memilih mengompos daun, bukan membakarnya.' },
  pemilah: { e: '🗂️', t: 'Pemilah Jitu', d: 'Memilah sampah organik, anorganik, dan B3 dengan tepat.' },
  ilmuwan: { e: '🔬', t: 'Ilmuwan Kompos', d: 'Berhasil membuat kompos matang di laboratorium.' },
  petani:  { e: '🌻', t: 'Petani Hijau', d: 'Menyuburkan kebun sekolah dengan kompos buatan sendiri.' },
  bumi:    { e: '🌍', t: 'Penjaga Bumi', d: 'Menuntaskan semua misi. Bumi bangga padamu!' },
};
function award(k) {
  return new Promise(res => {
    if (S.badges[k]) return res();
    S.badges[k] = true; save(); updateHud();
    const b = BADGES[k]; $('#bpE').textContent = b.e; $('#bpT').textContent = b.t; $('#bpD').textContent = b.d;
    $('#badgePop').classList.add('show'); sfx.win(); confetti(60); speak('Lencana baru! ' + b.t);
    $('#bpOk').onclick = () => { $('#badgePop').classList.remove('show'); res(); };
  });
}
function confetti(n = 80) {
  const cols = ['#facc15', '#22c55e', '#38bdf8', '#f472b6', '#f97316', '#a78bfa'];
  for (let i = 0; i < n; i++) {
    const d = document.createElement('div'); d.className = 'confetti';
    d.style.left = rnd(0, 1920) + 'px'; d.style.background = cols[i % cols.length];
    stage.appendChild(d);
    d.animate([{ transform: `translate(0,0) rotate(0)` }, { transform: `translate(${rnd(-200, 200)}px,${rnd(1000, 1200)}px) rotate(${rnd(360, 1080)}deg)` }],
      { duration: rnd(1800, 3200), delay: rnd(0, 600), easing: 'cubic-bezier(.3,.6,.6,1)', fill: 'forwards' }).onfinish = () => d.remove();
  }
}

/* ---------- helper SVG ---------- */
function svgEl(tag, attrs, parent) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }
function useSym(id, w, h, parent, x = 0, y = 0, extra = '') {
  const g = svgEl('g', {}, parent);
  svgEl('use', { href: '#' + id, width: w, height: h, x: -w / 2, y: -h / 2 }, g);
  g.style.transform = `translate(${x}px,${y}px) ${extra}`; return g;
}
const ic = (id, vb = '0 0 120 120') => `<svg viewBox="${vb}"><use href="#${id}"/></svg>`;

/* ---------- tombol topbar ---------- */
function isFs() { return document.fullscreenElement || document.webkitFullscreenElement; }
$('#bFs').onclick = () => {
  sfx.click();
  const el = document.documentElement;
  if (!isFs()) { (el.requestFullscreen || el.webkitRequestFullscreen || function () {}).call(el); }
  else { (document.exitFullscreen || document.webkitExitFullscreen).call(document); }
};
function fsLabel() { $('#bFs').innerHTML = isFs() ? '🗗 Keluar Layar Penuh' : '⛶ Layar Penuh'; setTimeout(fit, 120); }
document.addEventListener('fullscreenchange', fsLabel); document.addEventListener('webkitfullscreenchange', fsLabel);
$('#bSnd').onclick = () => { S.sound = !S.sound; save(); updateHud(); sfx.click(); };
$('#bNarr').onclick = () => { S.narr = !S.narr; save(); updateHud(); if (!S.narr && window.speechSynthesis) speechSynthesis.cancel(); else { const t = $('#sayT'); t && speak(t.innerHTML); } };
$('#bHome').onclick = () => { sfx.click(); go(cover); };

function go(fn) {
  clearTimers(); runId++; closeModal(); curMission = null; cur = 0;
  if (window.speechSynthesis) speechSynthesis.cancel();
  screen.innerHTML = ''; fn(); updateHud();
}

/* =========================================================
   BERANDA
   ========================================================= */
const MISSIONS = [
  { k: 'm1', fn: () => m1(), t: 'Selamatkan Halaman Sekolah', d: 'Daun kering menumpuk! Bakar, buang, atau olah jadi kompos?',
    ill: `<svg class="ill" viewBox="0 0 230 200"><use href="#leafDry" x="10" y="80" width="110" height="110"/><use href="#fire" x="110" y="40" width="80" height="94"/><use href="#smoke" x="120" y="0" width="100" height="70"/><use href="#bin" x="140" y="100" width="80" height="100"/></svg>` },
  { k: 'm2', fn: () => m2(), t: 'Petugas Pemilah Daun', d: 'Seret daun, ranting, plastik & sampah lain ke wadah yang benar.',
    ill: `<svg class="ill" viewBox="0 0 230 200"><use href="#leafGreen" x="0" y="20" width="80" height="80"/><use href="#bottle" x="75" y="10" width="80" height="80"/><use href="#battery" x="150" y="20" width="70" height="70"/><use href="#twig" x="20" y="100" width="90" height="90"/><use href="#can" x="120" y="100" width="90" height="90"/></svg>` },
  { k: 'm3', fn: () => m3(), t: 'Laboratorium Kompos', d: 'Campur bahan, atur kelembapan & udara, amati daun berubah jadi kompos.',
    ill: `<svg class="ill" viewBox="0 0 230 200"><use href="#bin" x="40" y="10" width="150" height="190"/><use href="#worm" x="120" y="140" width="100" height="60"/><use href="#chopped" x="0" y="110" width="80" height="80"/></svg>` },
  { k: 'm4', fn: () => m4(), t: 'Kebun Sekolah Hijau', d: 'Pakai kompos matang untuk menyuburkan tanaman & panen hasilnya.',
    ill: `<svg class="ill" viewBox="0 0 230 200"><rect x="10" y="150" width="210" height="40" rx="12" fill="#5b3a1e"/><path d="M115 150 V60" stroke="#15803d" stroke-width="8"/><ellipse cx="90" cy="100" rx="30" ry="12" fill="#22c55e" transform="rotate(-25 90 100)"/><ellipse cx="140" cy="80" rx="30" ry="12" fill="#22c55e" transform="rotate(25 140 80)"/><circle cx="100" cy="125" r="14" fill="#ef4444"/><circle cx="132" cy="112" r="14" fill="#ef4444"/><use href="#compostSack" x="160" y="90" width="70" height="76"/></svg>` },
];
/* =========================================================
   HALAMAN DEPAN: Sampul → Apersepsi → Tujuan → Profil → Petualangan → Refleksi
   ========================================================= */
const PAGES = [
  { k: 'cover', l: '📘 Sampul', s: 'Sampul', fn: () => cover() },
  { k: 'aper', l: '👀 Apersepsi', s: 'Apersepsi', fn: () => apersepsi() },
  { k: 'tujuan', l: '🎯 Tujuan', s: 'Tujuan', fn: () => tujuan() },
  { k: 'profil', l: '🌟 Profil Lulusan', s: 'Profil Lulusan', fn: () => profil() },
  { k: 'misi', l: '🚀 Petualangan', s: 'Petualangan', fn: () => home() },
  { k: 'refl', l: '💭 Refleksi', s: 'Refleksi', fn: () => refleksi() },
  { k: 'ases', l: '📝 Asesmen', s: 'Asesmen', fn: () => { location.href = 'asesmen.html'; } },
];
function frontNav(k, arrows = true, nextLabel) {
  const i = PAGES.findIndex(p => p.k === k);
  const nav = document.createElement('div'); nav.className = 'fnav';
  nav.innerHTML = PAGES.map((p, j) => `<button class="${j === i ? 'on' : ''}" data-j="${j}">${p.l}</button>`).join('');
  nav.querySelectorAll('button').forEach(b => b.onclick = () => { sfx.click(); go(PAGES[+b.dataset.j].fn); });
  screen.appendChild(nav);
  if (!arrows) return;
  const d = document.createElement('div'); d.className = 'parrows';
  d.innerHTML = (i > 0 ? `<button class="btn w" id="pPrev">⬅ ${PAGES[i - 1].s}</button>` : '<span></span>') +
    (i < PAGES.length - 1 ? `<button class="btn y glow" id="pNext">${nextLabel || PAGES[i + 1].s} ➜</button>` : '<span></span>');
  screen.appendChild(d);
  if (i > 0) $('#pPrev').onclick = () => { sfx.click(); go(PAGES[i - 1].fn); };
  if (i < PAGES.length - 1) $('#pNext').onclick = () => { sfx.click(); go(PAGES[i + 1].fn); };
}
function fallLeaves(host, n = 14) {
  for (let i = 0; i < n; i++) {
    const s = svgEl('svg', { class: 'fall', viewBox: '0 0 120 120' }, host);
    svgEl('use', { href: '#' + ['leafDry', 'leafDry2', 'leafYel'][i % 3] }, s);
    s.style.left = rnd(0, 1880) + 'px';
    s.animate([{ transform: 'translate(0,0) rotate(0)' }, { transform: `translate(${rnd(-150, 150)}px,1080px) rotate(${rnd(-540, 540)}deg)` }],
      { duration: rnd(7000, 13000), delay: rnd(0, 8000), iterations: Infinity });
  }
}

/* ---------- 1. Sampul ---------- */
function cover() {
  screen.innerHTML = `<div class="front" id="front">
    <div class="cov">
      <div class="covtag">📗 PELAJARAN IPA · KELAS VII SMP</div>

      </div>

        ${Array.from({ length: 16 }, (_, i) => `<use href="#${['leafDry', 'leafDry2', 'leafYel'][i % 3]}" x="${60 + (i * 37) % 360}" y="${550 + (i * 23) % 120}" width="60" height="60" transform="rotate(${i * 47} ${90 + (i * 37) % 360} ${580 + (i * 23) % 120})"/>`).join('')}

/* ---------- 2. Apersepsi ---------- */
function apersepsi() {

/* ---------- 3. Tujuan Pembelajaran ---------- */
function tujuan() {
  screen.innerHTML = `<div class="front" id="front">

const KIDPOS = [[430, 740, '#dc2626'], [690, 775, '#1d4ed8'], [1380, 765, '#dc2626'], [1610, 730, '#64748b']];

function m1() {
  curMission = 'm1'; cur = 0;
  const st = { first: null, seen: {}, won: false };
  render();
  function render() {
    clearTimers();
    screen.innerHTML = `<div class="m-tag">MISI 1 · Selamatkan Halaman Sekolah</div>${schoolScene()}${narrator()}
      <div class="aqi"><div class="t">🌫️ Kualitas Udara</div><div class="bar"><i id="aqiP"></i></div><div class="l" id="aqiL">Baik 😊</div></div>
      <div class="choices" id="ch">
        <button class="choice burn ${st.seen.burn ? 'seen' : ''}" data-c="burn"><span>🔥</span><div>Bakar<small>biar cepat bersih</small></div></button>
        <button class="choice dump ${st.seen.dump ? 'seen' : ''}" data-c="dump"><span>🚛</span><div>Buang<small>angkut ke TPA</small></div></button>
        <button class="choice comp" data-c="comp"><span>♻️</span><div>Kompos<small>olah jadi pupuk</small></div></button>
      </div>`;
    const L = $('#leaves');
    st.leaves = [];
    for (let i = 0; i < 46; i++) {
      const x = rnd(120, 1800), y = rnd(640, 960), r = rnd(0, 360), s = rnd(.8, 1.3);
      const g = useSym(['leafDry', 'leafDry2', 'leafYel'][i % 3], 64, 64, L, x, y, `rotate(${r}deg) scale(${s})`);
      g.dataset.r = r; g.dataset.s = s; st.leaves.push(g);
    }
    const K = $('#kids'); st.kids = [];
    KIDPOS.forEach(([x, y, c]) => { const g = useSym('kid', 90, 180, K, x, y - 90); g.style.color = c; st.kids.push(g); });
    say(st.won ? 'Kamu sudah menyelamatkan halaman! Coba lihat juga apa yang terjadi dengan pilihan lain.' :
      'Wah, halaman sekolah kita <b>penuh daun kering</b>! Apa yang sebaiknya kita lakukan dengan daun-daun ini? Pilih salah satu tombol di bawah.');
    document.querySelectorAll('.choice').forEach(b => b.onclick = () => { sfx.click(); choose(b.dataset.c); });
  }
  function aqi(p, label) { $('#aqiP').style.left = p + '%'; $('#aqiL').innerHTML = label; }
  function leavesTo(fx, fy, spreadX, spreadY, dur = 1200) {
    st.leaves.forEach((g, i) => {
      g.style.transition = `transform ${dur}ms cubic-bezier(.5,0,.3,1) ${i * 12}ms`;
      g.style.transform = `translate(${fx + rnd(-spreadX, spreadX)}px,${fy + rnd(-spreadY, spreadY)}px) rotate(${rnd(0, 360)}deg) scale(${g.dataset.s})`;
    });
  }
  async function choose(c) {
    if (!st.first) st.first = c;
    const id = runId;
    $('#ch').classList.add('lock');
    if (c === 'burn') await burn(id);
    else if (c === 'dump') await dump(id);
    else await comp(id);
  }
  async function burn(id) {
    say('Daun-daun dikumpulkan lalu… <b>dibakar</b>! Perhatikan apa yang terjadi pada udara dan teman-teman kita.');
    leavesTo(960, 800, 130, 40); await sleep(1500); if (id !== runId) return;
    const fx = $('#fx'), fires = [];
    [[900, 760, 1], [960, 740, 1.3], [1030, 765, 1.05], [940, 790, .8], [1000, 795, .85]].forEach(([x, y, s], i) => {
      const g = useSym('fire', 120 * s, 140 * s, fx, x, y);
      g.firstChild.classList.add('flick'); g.style.opacity = 0; g.style.transition = 'opacity .6s'; fires.push(g);
      later(() => g.style.opacity = 1, i * 200);
    });
    noise(1.5, .1, 700); every(() => noise(.6, .06, 600), 700);
    $('#haze').setAttribute('opacity', .45);
    aqi(55, 'Tidak Sehat 😟');
    later(() => st.leaves.forEach(g => g.style.filter = 'brightness(.25)'), 1800);

  /* ---- langkah 5: simulasi pengomposan ---- */
  function s5() {
    const PH = [
      { n: 'Mesofilik', c: '#0ea5e9', d: 'Bakteri <b>mesofilik</b> mulai mengurai gula dan bahan yang mudah terurai. Suhu naik perlahan dari suhu ruang.' },
      { n: 'Termofilik', c: '#dc2626', d: 'Suhu <b>50–65°C</b>! Bakteri termofilik bekerja paling cepat dan membunuh biji gulma serta kuman. Butuh banyak oksigen — rajin <b>diaduk</b>!' },
      { n: 'Pendinginan', c: '#d97706', d: 'Bahan mudah urai mulai habis, suhu turun. <b>Jamur dan aktinomiset</b> mengurai bagian keras daun (selulosa & lignin).' },
      { n: 'Pematangan', c: '#16a34a', d: '<b>Cacing tanah</b> dan organisme kecil datang. Kompos menjadi gembur, gelap, dan berbau seperti tanah.' },
    ];
    let day = 0, prog = 0, o2 = 100, temp = 29, badDays = 0, running = false, speed = 1, phase = -1, iv = null, pts = [[0, 29]], lastWarn = '';
    shell('🔬 Amati Proses Pengomposan', 'Jaga kondisi komposter tetap ideal: <b>kelembapan 40–60%</b> dan <b>oksigen cukup</b>. Tekan tombol saat dibutuhkan!',
      `<div style="display:flex;justify-content:space-between;align-items:center">
         <div class="daybox">📅 Hari ke-<span id="dd" style="font-size:44px">0</span> <span class="phase" id="ph">Siap</span></div>
         <div class="daybox">Kematangan <div class="meterbar" style="width:300px;height:44px"><div class="fill" id="pf" style="width:0%;background:#3f2a1d"></div><div class="val" id="pv" style="color:#fff;mix-blend-mode:difference">0%</div></div></div></div>
       <div class="simgrid" style="margin-top:12px">
         <div class="gauge"><div class="h">🌡️ Suhu <b id="gt">29°C</b></div><div class="meterbar"><div class="fill" id="tf" style="background:#ef4444"></div></div></div>
         <div class="gauge"><div class="h">💧 Kelembapan <b id="gm"></b></div><div class="meterbar"><div class="zone" style="left:40%;width:20%"></div><div class="fill" id="mf2" style="background:#0ea5e9"></div></div></div>
         <div class="gauge"><div class="h">🌬️ Oksigen <b id="go"></b></div><div class="meterbar"><div class="zone" style="left:40%;width:60%"></div><div class="fill" id="of" style="background:#22c55e"></div></div></div>
       </div>
       <svg class="chart" id="chart" viewBox="0 0 1100 230" preserveAspectRatio="none">
         <rect x="60" y="${y2(65)}" width="1030" height="${y2(50) - y2(65)}" fill="#fee2e2"/><text x="1080" y="${y2(63)}" text-anchor="end" font-size="20" fill="#b91c1c" font-weight="700">zona termofilik 50–65°C</text>
         ${[30, 40, 50, 60, 70].map(t => `<line x1="60" x2="1090" y1="${y2(t)}" y2="${y2(t)}" stroke="#e2e8f0"/><text x="50" y="${y2(t) + 7}" text-anchor="end" font-size="20" fill="#64748b">${t}°</text>`).join('')}
         <polyline id="pl" fill="none" stroke="#dc2626" stroke-width="5" stroke-linejoin="round"/>
         <text x="575" y="226" text-anchor="middle" font-size="20" fill="#64748b">hari →</text></svg>
       <div class="info" id="info">▶ Tekan <b>Mulai</b> untuk menjalankan waktu. Setiap detik = 1 hari.</div>`,
      `<div class="simbtns"><button class="btn g" id="bp">▶ Mulai</button><button class="btn w sm" id="bs">⏩ x1</button></div>
       <div class="simbtns"><button class="btn b" id="bw">💧 Siram</button><button class="btn y" id="ba">🔄 Aduk</button><button class="btn w" id="bd">🍂 + Daun</button></div>`);
    function y2(t) { return 210 - (t - 25) / 45 * 200; }
    const upd = () => {
      $('#dd').textContent = day;
      $('#gt').textContent = Math.round(temp) + '°C'; $('#tf').style.width = clamp((temp - 20) / 50 * 100, 0, 100) + '%';
      $('#gm').textContent = Math.round(st.moist) + '%'; $('#mf2').style.width = st.moist + '%';
      $('#go').textContent = Math.round(o2) + '%'; $('#of').style.width = o2 + '%';
      $('#pf').style.width = Math.min(prog, 100) + '%'; $('#pv').textContent = Math.floor(Math.min(prog, 100)) + '%';
      $('#pl').setAttribute('points', pts.map(([d, t]) => `${60 + d / 45 * 1030},${y2(t)}`).join(' '));
      const k = 1 - .38 * Math.min(prog, 100) / 100, base = 738;
      $('#pile').setAttribute('transform', `translate(0 ${base * (1 - k)}) scale(1 ${k})`);
      const H = base - topY;
      ['#ripe', '#ripe2'].forEach(s => { $(s).setAttribute('y', topY); $(s).setAttribute('height', H); });
      $('#ripe').setAttribute('opacity', clamp(prog / 100, 0, 1) * .95); $('#ripe2').setAttribute('opacity', clamp((prog - 40) / 60, 0, 1));
      $('#dry').setAttribute('opacity', st.moist < 30 ? .35 : 0);
    };
    function setPhase(p) {
      if (p === phase) return; phase = p;
      $('#ph').textContent = 'Fase ' + PH[p].n; $('#ph').style.background = PH[p].c;
      const info = $('#info'); info.className = 'info'; info.innerHTML = `🔎 <b>Fase ${PH[p].n}:</b> ${PH[p].d}`; say(`Fase <b>${PH[p].n}</b>! ` + PH[p].d.split('.')[0] + '.');
      if (p === 3) for (let i = 0; i < 5; i++) { const w = svgEl('use', { href: '#worm', width: 90, height: 52, x: rnd(110, 400), y: rnd(topY + 40, 690) }, $('#worms')); w.animate([{ transform: 'translateX(0)' }, { transform: `translateX(${rnd(-40, 40)}px)` }], { duration: 1500, direction: 'alternate', iterations: Infinity }); }
    }
    function steam(on) {
      const s = $('#steam'); if (!on) return;
      const p = svgEl('use', { href: '#smokePlain', width: 120, height: 80, x: -60, y: -40, opacity: .5 }, s);

      p.animate([{ transform: `translate(${rnd(180, 420)}px,100px) scale(.5)`, opacity: .6 }, { transform: `translate(${rnd(150, 450)}px,-20px) scale(1.4)`, opacity: 0 }], { duration: 1800, fill: 'forwards' }).onfinish = () => p.remove();
    }
    function flies(on) {

        const t = svgEl('text', { 'font-size': 40, x: 0, y: 0 }, f); t.textContent = i < 3 ? '🪰' : '🤢';
        t.animate([{ transform: `translate(${rnd(120, 480)}px,${rnd(60, 160)}px)` }, { transform: `translate(${rnd(120, 480)}px,${rnd(40, 140)}px)` }], { duration: rnd(500, 900), direction: 'alternate', iterations: Infinity });
      }
    }
    function warn(msg, cls) { if (msg === lastWarn) return; lastWarn = msg; const i = $('#info'); i.className = 'info ' + cls; i.innerHTML = msg; if (cls === 'no') sfx.bad(); }
    function tick() {

      o2 = clamp(o2 - (hot ? 7 : 4.5), 0, 100);

      const of = o2 >= 40 ? 1 : o2 >= 20 ? .6 : .2;
      const rf = st.ratio === 2 || st.ratio === 3 ? 1 : st.ratio === 4 ? .75 : st.ratio === 1 ? .8 : .6;
      const f = Math.min(mf, of);
      if (f < .6) badDays++;
      prog += 100 / 30 * rf * f;
      const p = Math.min(prog, 100);
      const tgt = p < 12 ? 30 + p / 12 * 22 : p < 55 ? 52 + Math.min(12, (p - 12) * .5) : p < 85 ? 64 - (p - 55) : 34 - (p - 85) * .25;
      temp = clamp(temp + ((tgt * (.6 + .4 * f)) - temp) * .6, 27, 68);
      pts.push([day, temp]);
      setPhase(p < 12 ? 0 : p < 55 ? 1 : p < 85 ? 2 : 3);
      if (of < 1) warn('😷 <b>Bau busuk!</b> Oksigen menipis, mikroba sulit bernapas. Ayo <b>ADUK</b> komposnya!', of < .6 ? 'no' : 'warn');
      else if (st.moist < 40) warn('🏜️ <b>Terlalu kering!</b> Mikroba melambat. <b>SIRAM</b> sedikit air.', mf < .6 ? 'no' : 'warn');
      else if (st.moist > 60) warn('💦 <b>Terlalu basah & becek!</b> Tambah <b>daun kering</b> atau aduk.', mf < .6 ? 'no' : 'warn');
      else if (lastWarn) { lastWarn = ''; const i = $('#info'); i.className = 'info ok'; i.innerHTML = `👍 Kondisi ideal! Mikroba bekerja dengan baik. <br>🔎 <b>Fase ${PH[phase].n}:</b> ${PH[phase].d}`; }
      flies(of < .6 || st.moist > 66);
      if (temp > 48) { steam(true); later(() => steam(true), 300); }
      upd();
      if (prog >= 100) { stop(); later(finish, 600); }
    }
    function start() { running = true; $('#bp').innerHTML = '⏸ Jeda'; iv = every(tick, 1000 / speed); }
    function stop() { running = false; $('#bp').innerHTML = '▶ Lanjut'; clearInterval(iv); }
    $('#bp').onclick = () => { sfx.click(); running ? stop() : start(); };
    $('#bs').onclick = () => { speed = speed === 1 ? 2 : speed === 2 ? 3 : 1; $('#bs').innerHTML = '⏩ x' + speed; if (running) { clearInterval(iv); iv = every(tick, 1000 / speed); } sfx.click(); };
    $('#bw').onclick = () => { st.moist = clamp(st.moist + 10, 0, 100); sfx.water(); lid(true); setTimeout(() => lid(false), 400); upd(); };
    $('#bd').onclick = () => { st.moist = clamp(st.moist - 8, 0, 100); sfx.pop(); upd(); };
    $('#ba').onclick = () => {
      o2 = 100; st.moist = clamp(st.moist - 3, 0, 100); tone(180, .3, 'triangle', .12, 0, 360);
      $('#layers').animate([{ transform: 'rotate(0)' }, { transform: 'translate(10px,-6px) rotate(1deg)' }, { transform: 'translate(-10px,4px) rotate(-1deg)' }, { transform: 'rotate(0)' }], { duration: 500 });

    async function finish() {

      addPts(stars * 25, 340, 400);
      finishMission('m3');
      sfx.win(); confetti(50);
      await award('ilmuwan');
      modal({ title: '🎉 Kompos Sudah Matang!', lead: `Kompos matang dalam <b>${day} hari</b> simulasi · Kualitas: ${'⭐'.repeat(stars)}${'☆'.repeat(3 - stars)} ${badDays ? `(kondisi buruk selama ${badDays} hari)` : '(kondisi selalu ideal!)'}`,
        html: `<div class="row"><svg width="300" height="260" viewBox="0 0 300 260" style="flex:none"><ellipse cx="150" cy="200" rx="140" ry="50" fill="#2b1d14"/><path d="M20 200 Q150 60 280 200Z" fill="#3f2a1d"/><rect x="40" y="120" width="220" height="80" fill="url(#crumb)" opacity=".001"/>
          ${Array.from({ length: 30 }, () => `<circle cx="${rnd(50, 250)}" cy="${rnd(140, 220)}" r="${rnd(3, 7)}" fill="#1c1917"/>`).join('')}<use href="#worm" x="150" y="150" width="90" height="50"/></svg>
          <div class="facts" style="grid-template-columns:1fr 1fr;flex:1">
            <div class="fact good"><div class="ic">🟫</div><h4>Warna</h4>Cokelat kehitaman, seperti tanah.</div>
            <div class="fact good"><div class="ic">👃</div><h4>Bau</h4>Berbau tanah segar, tidak busuk.</div>
            <div class="fact good"><div class="ic">🤏</div><h4>Tekstur</h4>Remah & gembur, bentuk daun asli tak terlihat lagi.</div>
            <div class="fact good"><div class="ic">🌡️</div><h4>Suhu</h4>Sudah dingin, sama dengan suhu sekitar.</div>
          </div></div>
          <div class="note g">📅 Di dunia nyata, kompos daun yang dicacah dan rajin diaduk biasanya matang dalam <b>4–8 minggu</b>. Tanpa dicacah & diaduk bisa sampai berbulan-bulan.</div>`,
        buttons: [{ label: '🌱 Lanjut ke Misi 4', cls: 'g', on: () => go(m4) }, { label: '🔄 Ulangi Misi 3', cls: 'w', on: () => go(m3) }] });
    }
  }
  s1();
}

/* =========================================================
   MISI 4 — KEBUN SEKOLAH HIJAU
   ========================================================= */
function m4() {
  curMission = 'm4'; cur = 0;
  const BY = 560;
  const stars = (S.compost && S.compost.stars) || 2;
  const BEDS = [
    { n: 'Cabai', x: 300, fr: 'chili', col: '#dc2626' },
    { n: 'Tomat', x: 740, fr: 'round', col: '#ef4444' },
    { n: 'Terong', x: 1180, fr: 'egg', col: '#7e22ce' },
    { n: 'Tomat (tanpa kompos)', x: 1620, fr: 'round', col: '#ef4444', ctrl: true },
  ].map(b => Object.assign(b, { comp: false, seed: !!b.ctrl, water: !!b.ctrl, stage: b.ctrl ? 1 : 0 }));
  let tool = null, harvested = 0, totalFruit = 0, grown = false;
  screen.innerHTML = `<div class="m-tag">MISI 4 · Kebun Sekolah Hijau</div>
    <svg class="scene" id="gd" viewBox="0 0 1920 984" preserveAspectRatio="xMidYMid slice">
      <defs><linearGradient id="sk4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#e0f2fe"/></linearGradient></defs>
      <rect width="1920" height="984" fill="url(#sk4)"/>
      <g id="sun4"><circle cx="0" cy="0" r="70" fill="#fde047" stroke="#facc15" stroke-width="14"/></g>
      <path d="M0 470 Q400 400 900 450 T1920 430 V984 H0Z" fill="#86efac"/>
      ${Array.from({ length: 20 }, (_, i) => `<rect x="${i * 100 + 10}" y="440" width="22" height="120" rx="6" fill="#fef3c7" stroke="#a16207" stroke-width="3"/>`).join('')}
      <rect y="470" width="1920" height="14" fill="#fef3c7"/><rect y="520" width="1920" height="14" fill="#fef3c7"/>
      <rect y="560" width="1920" height="424" fill="#65a30d"/>
      <g id="beds"></g>
      <rect id="night" width="1920" height="984" fill="#0f172a" opacity="0" pointer-events="none"/>
      <g id="fx4"></g>
    </svg>
    ${narrator()}
    <div class="basket" id="bk">🧺 Panen: 0</div>
    <div class="tools" id="tools">
      <button class="tool" data-t="comp"><span>${ic('compostSack', '0 0 120 130').replace('<svg', '<svg width="70" height="70"')}</span>Kompos</button>
      <button class="tool" data-t="seed"><span>🌱</span>Bibit</button>
      <button class="tool" data-t="water"><span>🚿</span>Siram</button>
      <button class="btn y" id="grow" disabled style="height:150px;border-radius:30px">☀️ Tunggu 4 Minggu</button>
    </div>`;
  const sun = $('#sun4'); sun.setAttribute('transform', 'translate(1700 130)');
  const G = $('#beds');
  BEDS.forEach((b, i) => {
    const g = svgEl('g', { transform: `translate(${b.x} ${BY})` }, G);
    svgEl('rect', { x: -12, y: -40, width: 10, height: 130, fill: '#a16207' }, g);
    const sign = svgEl('g', { transform: 'translate(-110 -10)' }, g);
    svgEl('rect', { x: -100 + (b.ctrl ? -40 : 0), y: 170, width: b.ctrl ? 330 : 220, height: 52, rx: 12, fill: b.ctrl ? '#fef3c7' : '#fff', stroke: '#a16207', 'stroke-width': 4 }, sign);
    const tx = svgEl('text', { x: 10 + (b.ctrl ? 25 : 0), y: 206, 'text-anchor': 'middle', 'font-size': 28, 'font-weight': 800, fill: '#14532d' }, sign); tx.textContent = b.n;
    b.soil = svgEl('path', { d: 'M-190 60 Q0 20 190 60 L200 130 H-200 Z', fill: '#c08a52', stroke: '#78350f', 'stroke-width': 6 }, g);
    b.plant = svgEl('g', { transform: 'translate(0 50)' }, g);
    const hit = svgEl('rect', { x: -200, y: -320, width: 400, height: 460, fill: 'transparent', class: 'bed-hit' }, g);
    hit.addEventListener('click', () => useTool(b));
    b.g = g; drawPlant(b);
  });
  function drawPlant(b, pop) {
    const P = b.plant; P.innerHTML = '';
    if (!b.stage) return;
    const healthy = !b.ctrl, k = healthy ? 1 : .55;
    const H = [0, 36, 100, 175, 250][b.stage] * k;
    const leaf = healthy ? '#16a34a' : '#a3a635', leaf2 = healthy ? '#22c55e' : '#bef264';
    svgEl('path', { d: `M0 0 Q${b.stage > 2 ? 10 : 4} ${-H / 2} 0 ${-H}`, stroke: healthy ? '#15803d' : '#84cc16', 'stroke-width': 4 + b.stage * 2 * k, fill: 'none', 'stroke-linecap': 'round' }, P);
    const n = b.stage === 1 ? 1 : b.stage * 2;
    for (let j = 1; j <= n; j++) {
      const y = -H * j / (n + .4), side = j % 2 ? 1 : -1, L = (18 + b.stage * 9) * k;
      svgEl('ellipse', { cx: side * L * .8, cy: y, rx: L, ry: L * .38, fill: j % 2 ? leaf : leaf2, transform: `rotate(${side * -25} ${side * L * .8} ${y})`, stroke: '#14532d', 'stroke-width': 2 }, P);
    }
    if (b.stage === 4 && !b.ctrl && !b.harvest) {
      b.fruits = 2 + stars; b.harvest = true; totalFruit += b.fruits;
    }
    if (b.stage === 4 && !b.ctrl) {
      for (let j = 0; j < b.left; j++) {
        const y = -H * (j + 1) / (b.fruits + 1.5) - 10, x = (j % 2 ? 1 : -1) * (30 + (j % 3) * 8);
        let f;
        if (b.fr === 'chili') f = svgEl('ellipse', { cx: x, cy: y + 20, rx: 9, ry: 26, fill: b.col, stroke: '#7f1d1d', 'stroke-width': 3, transform: `rotate(${x > 0 ? -15 : 15} ${x} ${y + 20})` }, P);
        else if (b.fr === 'round') f = svgEl('circle', { cx: x, cy: y + 14, r: 20, fill: b.col, stroke: '#7f1d1d', 'stroke-width': 3 }, P);
        else f = svgEl('ellipse', { cx: x, cy: y + 22, rx: 15, ry: 28, fill: b.col, stroke: '#3b0764', 'stroke-width': 3 }, P);
        f.setAttribute('class', 'fruit');
        f.addEventListener('click', e => { e.stopPropagation(); pick(b, f); });
      }
    }
    if (pop) P.firstChild && P.classList.add('grow-pop'), setTimeout(() => P.classList.remove('grow-pop'), 650);
  }
  function selTool(t) {
    tool = t; document.querySelectorAll('.tool').forEach(x => x.classList.toggle('sel', x.dataset.t === t)); sfx.click();
    const msg = { comp: 'Sentuh bedengan untuk <b>menaburkan dan mencampur kompos</b> ke tanah.', seed: 'Sentuh bedengan yang sudah diberi kompos untuk <b>menanam bibit</b>.', water: 'Sentuh bedengan yang sudah ditanami untuk <b>menyiram</b>.' }[t];
    say(msg);
  }
  document.querySelectorAll('.tool').forEach(x => x.onclick = () => selTool(x.dataset.t));
  function particles(b, color, n = 18, fromY = -200) {
    for (let i = 0; i < n; i++) {
      const c = svgEl('circle', { r: rnd(5, 10), fill: color }, $('#fx4'));
      c.animate([{ transform: `translate(${b.x + rnd(-60, 60)}px,${BY + fromY}px)` }, { transform: `translate(${b.x + rnd(-170, 170)}px,${rnd(BY + 50, BY + 90)}px)`, opacity: .3 }], { duration: rnd(500, 900), delay: i * 25, fill: 'forwards' }).onfinish = () => c.remove();
    }
  }
  function useTool(b) {
    if (grown) return;
    if (b.ctrl) { toast('🔬 Bedengan ini <b>pembanding</b>: sengaja tidak diberi kompos. Kita lihat bedanya nanti!'); return; }
    if (!tool) { toast('👇 Pilih alat dulu di bawah: Kompos, Bibit, atau Siram.'); return; }
    if (tool === 'comp') {
      if (b.comp) return toast('Bedengan ini sudah diberi kompos 👍');
      b.comp = true; particles(b, '#3f2a1d', 26); b.soil.setAttribute('fill', '#4a2f1b'); addPts(5, b.x, BY - 200); sfx.good();
    } else if (tool === 'seed') {
      if (!b.comp) { sfx.bad(); return toast('🟫 Campurkan <b>kompos</b> ke tanah dulu sebelum menanam!', true); }
      if (b.seed) return toast('Bibit sudah ditanam 🌱');
      b.seed = true; b.stage = 1; drawPlant(b, true); addPts(5, b.x, BY - 200); sfx.pop();
    } else if (tool === 'water') {
      if (!b.seed) { sfx.bad(); return toast('🌱 Tanam <b>bibit</b> dulu, baru disiram.', true); }
      if (b.water) return toast('Sudah disiram 💧');
      b.water = true; particles(b, '#38bdf8', 22, -260); sfx.water(); addPts(5, b.x, BY - 200);
    }
    const ready = BEDS.every(x => x.ctrl || (x.comp && x.seed && x.water));
    if (ready) { $('#grow').disabled = false; $('#grow').classList.add('glow'); say('Semua bedengan siap! Tekan <b>☀️ Tunggu 4 Minggu</b> dan lihat apa yang terjadi.'); }
  }
  $('#grow').onclick = async () => {
    const id = runId; $('#grow').disabled = true; $('#grow').classList.remove('glow'); grown = true; tool = null;
    document.querySelectorAll('.tool').forEach(x => x.classList.remove('sel'));
    for (let w = 1; w <= 4; w++) {
      say(`⏳ Minggu ke-<b>${w}</b>… tanaman menyerap unsur hara dari kompos.`);
      sun.animate([{ transform: 'translate(150px,500px)' }, { transform: 'translate(960px,100px)' }, { transform: 'translate(1770px,500px)' }], { duration: 1400 });
      $('#night').animate([{ opacity: .55 }, { opacity: 0 }, { opacity: 0 }, { opacity: .55 }], { duration: 1400 });
      await sleep(1400); if (id !== runId) return;
      BEDS.forEach(b => {
        if (b.ctrl) b.stage = Math.min(w >= 2 ? 2 : 1, 4) + (w === 4 ? 1 : 0); else b.stage = Math.min(4, w);
        if (b.stage === 4 && !b.ctrl) b.left = b.left == null ? 2 + stars : b.left;
        drawPlant(b, true);
      });
      tone(400 + w * 120, .2, 'triangle', .15);
    }
    sun.setAttribute('transform', 'translate(1700 130)');
    say('Lihat bedanya! Tanaman <b>dengan kompos</b> tumbuh subur dan berbuah lebat. Yang <b>tanpa kompos</b> kurus dan pucat. Ayo <b>petik buahnya</b>!');
  };
  function pick(b, f) {
    b.left--; harvested++; f.style.pointerEvents = 'none';
    const bb = f.getBBox(); addPts(5, b.x + bb.x + 40, BY + 50 + bb.y);
    f.animate([{ transform: 'translate(0,0)' }, { transform: `translate(${1800 - b.x}px,${-BY}px) scale(.4)`, opacity: 0 }], { duration: 700, easing: 'ease-in', fill: 'forwards' });
    sfx.pop(); $('#bk').textContent = '🧺 Panen: ' + harvested;
    if (harvested === totalFruit) later(done, 900);
  }
  async function done() {
    finishMission('m4'); sfx.win(); confetti(70);
    await award('petani');
    modal({ title: '🌻 Kebun Sekolah Jadi Subur!', lead: `Kamu memanen <b>${harvested} buah</b> dari kebun yang diberi kompos buatanmu sendiri.`,
      html: `<div class="facts">
        <div class="fact good"><div class="ic">🌿</div><h4>Unsur hara alami</h4>Kompos melepas nitrogen, fosfor, dan kalium <b>secara perlahan</b> sehingga tanaman tumbuh sehat.</div>
        <div class="fact good"><div class="ic">💧</div><h4>Tanah menahan air</h4>Tanah berkompos lebih gembur dan menyimpan air lebih lama, jadi tidak cepat kering.</div>
        <div class="fact good"><div class="ic">🦠</div><h4>Mikroba tanah hidup</h4>Kompos memberi makan organisme tanah yang membantu akar menyerap nutrisi.</div>
        <div class="fact warn"><div class="ic">🥀</div><h4>Tanpa kompos</h4>Tanah padat & miskin hara: tanaman kurus, daun pucat, buahnya sedikit.</div>
        <div class="fact good"><div class="ic">🪴</div><h4>Cara pakai</h4>Campur <b>1 bagian kompos : 2–3 bagian tanah</b> untuk pot, atau taburkan di sekitar tanaman lalu aduk dengan tanah.</div>
        <div class="fact good"><div class="ic">🔁</div><h4>Siklus tanpa sampah</h4>Daun gugur → kompos → tanaman tumbuh → daun gugur lagi. Tidak ada yang perlu dibakar!</div>
      </div>`,
      buttons: [{ label: '🏆 Lihat Predikatku!', cls: 'y', on: () => go(final) }] });
  }
  say('Kompos kita sudah matang! Ayo <b>suburkan kebun sekolah</b>. Pilih alat, lalu sentuh bedengan: <b>Kompos → Bibit → Siram</b>.');
}

/* =========================================================
   SERTIFIKAT & PREDIKAT
   ========================================================= */
async function final() {
  const all = MISSIONS.every(m => S.done[m.k]);
  const tot = totalScore(), max = Object.values(MAX).reduce((a, b) => a + b, 0), pct = tot / max;
  const pred = !all ? 'Calon Penjaga Bumi' : pct >= .8 ? 'Penjaga Bumi ⭐⭐⭐ Emas' : pct >= .55 ? 'Penjaga Bumi ⭐⭐ Perak' : 'Penjaga Bumi ⭐ Perunggu';
  screen.innerHTML = `<div class="home"></div><div class="cert" id="cert">
    <h1>🏆 SERTIFIKAT PENJAGA BUMI</h1>
    <div style="font-size:24px;font-weight:700;color:#a16207">IPA Kelas VII · Pencemaran Lingkungan · SMP Negeri 1 Bandar Seikijang</div>
    <div style="font-size:28px;font-weight:600;margin-top:2px">diberikan kepada</div>
    <div class="nm" id="nmShow">${S.name || 'Sahabat Bumi'}</div>
    <div class="noprint" style="margin:4px 0 6px"><input class="namein" id="nmIn" maxlength="30" placeholder="Ketik nama / kelompok di sini" value="${S.name || ''}"></div>
    <div class="pred">${pred}</div>
    <div style="font-size:30px;font-weight:700">Skor total: ⭐ ${tot} / ${max}</div>
    <div class="badges">${Object.entries(BADGES).map(([k, b]) => `<div class="bd ${S.badges[k] || (k === 'bumi' && all) ? '' : 'no'}"><div class="e">${b.e}</div>${b.t}</div>`).join('')}</div>
    <div class="pledge" id="pledge"><b>🤝 Ikrar Penjaga Bumi</b> <span class="noprint" style="color:#64748b">(sentuh untuk berikrar)</span><br>
      Aku berjanji <b>tidak membakar sampah dan daun</b>, memilah sampah, mengolah daun menjadi kompos, dan mengajak teman-teman menjaga udara tetap bersih.</div>
    <div class="noprint" style="display:flex;gap:20px;justify-content:center;margin-top:12px">
      <button class="btn g" id="cHome">🏠 Beranda</button><button class="btn w" id="cPrint">🖨️ Cetak</button><button class="btn y" id="cRefl">💭 Refleksi</button><button class="btn w" id="cAgain">🔄 Main Lagi</button></div>
  </div>`;
  $('#nmIn').oninput = e => { S.name = e.target.value.trim(); $('#nmShow').textContent = S.name || 'Sahabat Bumi'; save(); };
  $('#cHome').onclick = () => go(home);
  $('#cPrint').onclick = () => window.print();
  $('#cRefl').onclick = () => go(refleksi);
  $('#cAgain').onclick = () => { const snd = S.sound, nar = S.narr; S = JSON.parse(JSON.stringify(S0)); S.sound = snd; S.narr = nar; save(); go(home); };
  $('#pledge').onclick = () => { $('#pledge').style.background = '#dcfce7'; $('#pledge').style.borderColor = '#16a34a'; sfx.win(); confetti(60); speak('Aku berjanji tidak membakar sampah dan daun, memilah sampah, mengolah daun menjadi kompos, dan mengajak teman-teman menjaga udara tetap bersih.'); };
  if (all) { sfx.win(); confetti(120); await award('bumi'); }
  speak('Selamat! Predikatmu: ' + pred.replace(/⭐/g, ''));
}

/* ---------- mulai ---------- */
if (window.speechSynthesis) speechSynthesis.getVoices();
document.addEventListener('contextmenu', e => e.preventDefault());
{ const P = PAGES.find(p => '#' + p.k === location.hash || (location.hash === '#refleksi' && p.k === 'refl')); go(P && P.k !== 'ases' ? P.fn : cover); }
</script>
</body>
